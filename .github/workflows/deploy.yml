name: Deploy

on:
  push:
    branches: [main]

concurrency: production_environment

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deployer
        uses: deployphp/action@v1
        with:
          deployer-version: 8.0.5
          private-key: ${{ secrets.PRIVATE_KEY }}
          dep: deploy
